name: Build

# Tests and builds the Mac app, and builds the iOS app, on pull requests that change them. Main is
# published by release.yml and, for iOS, ios.yml.
on:
  pull_request:
    paths:
      - Sources/**
      - Tests/**
      - Resources/**
      - Package.swift
      - scripts/**
      - ios/**
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build the app
        run: scripts/build-app.sh

      - name: Zip the app
        run: ditto -c -k --keepParent build/Routey.app Routey.zip

      - uses: actions/upload-artifact@v7
        with:
          name: Routey
          path: Routey.zip
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the iOS app for the simulator
        run: |
          xcodebuild build -project ios/Routey.xcodeproj -scheme Routey \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
